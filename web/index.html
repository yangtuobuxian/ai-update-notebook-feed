ta). They show as server:skill in the / menu; other skills keep their names","Added a PreSkillShellCommand hook event that can refuse a skill or command's inline shell commands as it loads; on 2.1.331 and older, a settings file naming it opens a dialog at start",'Added "Always deliver" to the prompt for held messages from other sessions'],firstSeenAt:"2026-11-25T05:26:16.713Z",guide:{kind:"ai",title:"新增MCP服务器技能（Beta版）",summary:"从MCP服务器添加了新技能（Beta版）。这些技能在菜单中显示为'server:skill'；其他技能保持原名。",audience:"Claude Code 用户",action:"在菜单中查看新增的'server:skill'技能",basis:"Added skills from MCP servers (beta). They show as server:skill in the / menu; other skills keep their names",format:5}},{id:"ollama-v0.40.18",product:"ollama",version:"0.40.18",date:"2026-11-24",publishedAt:"2026-11-24T04:18:13Z",url:"https://github.com/ollama/ollama/releases/tag/v0.40.18",highlights:["mlx: fuse Inkling residual mixing on Metal by @dhiltgen in https://github.com/ollama/ollama/pull/19808","mlxrunner: share tensor helpers and model setup across architectures by @jaingaurav in https://github.com/ollama/ollama/pull/19805","llama.cpp: version bump b12651 + remove jetpack5 support by @pdevine in https://github.com/ollama/ollama/pull/19865"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"Ollama 加快 Inkling 2 在 Metal 上的推理",summary:"这次更新调整了 Inkling 2 在 Metal 上的预填充、解码和草稿轮次。官方发布页列出了对应改动。",audience:"通过 Ollama 在 Metal 上运行 Inkling 2 的用户。",action:"更新到 0.40.18，用同一段输入对照升级前后的生成速度。",kind:"editor"}},{id:"codex-rust-v0.172.0",product:"codex",version:"0.172.0",date:"2026-11-24",publishedAt:"2026-11-24T00:03:55Z",url:"https://github.com/openai/codex/releases/tag/rust-v0.172.0",highlights:["Follow thread links from search results and transcripts to open saved conversations and nested agents in the terminal.","Press Tab to complete arguments for supported slash commands. For example, /mcp lo completes to /mcp login.","Jump between task groups in the agent command center with Shift+Up and Shift+Down."],firstSeenAt:"2026-11-24T11:35:59.658Z",guide:{title:"终端斜杠命令支持 Tab 补全",summary:"不用记全命令参数。输入前几个字母，按 Tab 就能补全支持的命令。",audience:"使用 Codex CLI 0.172.0 的终端用户。",action:"在终端打开 Codex，输入 /mcp lo，再按 Tab。输入框会补全为 /mcp login。",sample:"/mcp lo",result:"/mcp login",kind:"editor"}},{id:"claude-v2.1.331",product:"claude",version:"2.1.331",date:"2026-11-24",publishedAt:"2026-11-23T21:34:41Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.331",highlights:["Added Code Mode support in terminal sessions on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry and Claude Platform on AWS","Added oidc.groups_jsonpath to the Claude apps gateway, to read groups from the matching entries of a list of objects with a small subset of JSONPath (RFC 9535)","Added an API connectivity section to claude doctor that reports whether the API can be reached, with the HTTP status or the error, or says why it wasn't tested"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"终端里也能检查 Claude API 是否可达",summary:"Claude Code 的诊断命令新增 API 连通性检查，可显示 HTTP 状态、连接错误或跳过检查的原因。",audience:"使用 Claude Code 排查连接问题的人。",action:"在终端运行 claude doctor，查看 API 连通性一栏。",kind:"editor"}},{id:"claude-v2.1.330",product:"claude",version:"2.1.330",date:"2026-11-21",publishedAt:"2026-11-20T22:32:56Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.330",highlights:["Added sign-in to organizations managed in Anthropic's Enterprise Admin Console: after claude auth login, Claude Code applies the organization's settings and uses its cloud provider or gateway","Added easel, a built-in mod that draws charts when asked and under MCP metrics results, on Pro, Max and, where available, Team and Enterprise on macOS and Linux; turn automatic charts off in /config","Added CLAUDE_CODE_FULL_SIGN_IN_LINK=1 to print the full sign-in link, if the short one shows an error or a script reads values from it"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"企业账号登录后自动应用组织设置",summary:"由 Anthropic 企业管理控制台管理的组织可以登录 Claude Code。登录后会应用组织设置，
