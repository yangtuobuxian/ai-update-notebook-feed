ntries:[{id:"ollama-v0.40.18",product:"ollama",version:"0.40.18",date:"2026-11-24",publishedAt:"2026-11-24T04:18:13Z",url:"https://github.com/ollama/ollama/releases/tag/v0.40.18",highlights:["mlx: fuse Inkling residual mixing on Metal by @dhiltgen in https://github.com/ollama/ollama/pull/19808","mlxrunner: share tensor helpers and model setup across architectures by @jaingaurav in https://github.com/ollama/ollama/pull/19805","llama.cpp: version bump b12651 + remove jetpack5 support by @pdevine in https://github.com/ollama/ollama/pull/19865"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"Ollama 加快 Inkling 2 在 Metal 上的推理",summary:"这次更新调整了 Inkling 2 在 Metal 上的预填充、解码和草稿轮次。官方发布页列出了对应改动。",audience:"通过 Ollama 在 Metal 上运行 Inkling 2 的用户。",action:"更新到 0.40.18，用同一段输入对照升级前后的生成速度。",kind:"editor"}},{id:"codex-rust-v0.172.0",product:"codex",version:"0.172.0",date:"2026-11-24",publishedAt:"2026-11-24T00:03:55Z",url:"https://github.com/openai/codex/releases/tag/rust-v0.172.0",highlights:["Follow thread links from search results and transcripts to open saved conversations and nested agents in the terminal.","Press Tab to complete arguments for supported slash commands. For example, /mcp lo completes to /mcp login.","Jump between task groups in the agent command center with Shift+Up and Shift+Down."],firstSeenAt:"2026-11-24T11:35:59.658Z",guide:{title:"终端斜杠命令支持 Tab 补全",summary:"不用记全命令参数。输入前几个字母，按 Tab 就能补全支持的命令。",audience:"使用 Codex CLI 0.172.0 的终端用户。",action:"在终端打开 Codex，输入 /mcp lo，再按 Tab。输入框会补全为 /mcp login。",sample:"/mcp lo",result:"/mcp login",kind:"editor"}},{id:"claude-v2.1.331",product:"claude",version:"2.1.331",date:"2026-11-24",publishedAt:"2026-11-23T21:34:41Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.331",highlights:["Added Code Mode support in terminal sessions on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry and Claude Platform on AWS","Added oidc.groups_jsonpath to the Claude apps gateway, to read groups from the matching entries of a list of objects with a small subset of JSONPath (RFC 9535)","Added an API connectivity section to claude doctor that reports whether the API can be reached, with the HTTP status or the error, or says why it wasn't tested"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"终端里也能检查 Claude API 是否可达",summary:"Claude Code 的诊断命令新增 API 连通性检查，可显示 HTTP 状态、连接错误或跳过检查的原因。",audience:"使用 Claude Code 排查连接问题的人。",action:"在终端运行 claude doctor，查看 API 连通性一栏。",kind:"editor"}},{id:"claude-v2.1.330",product:"claude",version:"2.1.330",date:"2026-11-21",publishedAt:"2026-11-20T22:32:56Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.330",highlights:["Added sign-in to organizations managed in Anthropic's Enterprise Admin Console: after claude auth login, Claude Code applies the organization's settings and uses its cloud provider or gateway","Added easel, a built-in mod that draws charts when asked and under MCP metrics results, on Pro, Max and, where available, Team and Enterprise on macOS and Linux; turn automatic charts off in /config","Added CLAUDE_CODE_FULL_SIGN_IN_LINK=1 to print the full sign-in link, if the short one shows an error or a script reads values from it"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"企业账号登录后自动应用组织设置",summary:"由 Anthropic 企业管理控制台管理的组织可以登录 Claude Code。登录后会应用组织设置，并使用组织配置的云服务或网关。",audience:"使用企业管理控制台账号的 Claude Code 用户。",action:"在终端运行 claude auth login，用所在组织的账号登录。",kind:"editor"}},{id:"codex-rust-v0.171.0",product:"codex",version:"0.171.0",date:"2026-11-20",publishedAt:"2026-11-20T00:44:47Z",url:"https://github.com/openai/codex/releases/tag/rust-v0.171.0",highlights:["Added GPT-6.2 Sol and Astra to model catalogs, with Sol as the default catalog selection.","Enabled the TUI workspace by default, with searchable document previews, image previews, and subagent transcripts alongside the main conversation.","Added configurable undo and redo shortcuts to the non-Vim prompt composer, including restoration of attachments and large pastes."],firstSeenAt:"2026-11-24T11:35:59.658Z",guide:{title:"在终端对话旁预览文件和图片",summary:"终端工作区默认开启，可以在主对话旁查看文件、图片和子代理的对话记录。",audience:"使用 Codex CLI 0.171.0 终端界面的用户。",action:"打开终端工作区，在包含文档或图片的对话中查看侧边预览。此版本也将 GPT-6.2 Sol 和 Astra 加入了模型目录。",kind:"editor"}},{id:"claude-v2.1.329",product:"claude",version:"2.1.329",date:"2026-11-20",publishedAt:"2026-11-19T22:14:41Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.329",highlights:["Added a trust dialog warning that says where a folder's hooks are declared","Added a warning in the conversation, in Claude Desktop and other non-interactive hosts, when hooks in managed settings fail to load","Added this session's scheduled tasks, /loop wakeups, the goal and this conversation's forks to /tasks; x stops one after asking"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"用 /tasks 查看当前会话的定时任务",summary:"任务列表现在会显示本次会话的定时任务、循环、目标和分支对话。在列表里可选择要停止的项目并确认。",audience:"在 Claude Code 会话里使用任务或循环的人。",action:"输入 /tasks，找到当前会话正在运行的任务。",kind:"editor"}},{id:"claude-v2.1.328",product:"claude",version:"2.1.328",date:"2026-11-19",publishedAt:"2026-11-19T01:14:04Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.328",highlights:["Added auto mode for Claude Opus 4.6 and Sonnet 4.6 on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry and Claude apps gateway; interactive sessions with no permission mode start in it",'Added "onFailure": "block" for mcp_tool hooks, as for command and HTTP hooks: a hook whose call fails blocks the action',"Added a warning when a message from a session that skips permission prompts may be held and dropped by a cloud session"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{title:"诊断页会提示遥测数据可能丢失",summary:"当 OpenTelemetry 导出器缺少接收地址时，Claude Code 会在状态页和诊断命令里显示提醒。",audience:"为 Claude Code 配置 OpenTelemetry 的团队。",action:"打开 /status 或运行 claude doctor，检查导出器是否设置了接收地址。",kind:"editor"}},{id:"codex-rust-v0.170.0",product:"codex",version:"0.170.0",date:"2026-11-18",publishedAt:"2026-11-18T03:40:48Z",url:"https://github.com/openai/codex/releases/tag/rust-v0.170.0",highlights:["Added WebRTC negotiation for realtime voice calls in the TUI.","Added automatically refreshed authentication headers for OpenTelemetry HTTP exporters.","Added experimental support for using identically named MCP servers across environments."],firstSeenAt:"2026-11-24T11:35:59.658Z",guide:{title:"终端实时语音加入 WebRTC 协商",summary:"新版更新了实时语音的连接方式，也为跨环境使用同名 MCP 服务加入了实验支持。",audience:"使用 Codex CLI 实时语音或多个 MCP 环境的开发者。",action:"先核对终端版本；使用实时语音时，可在官方发布说明里查看这次连接层的变化。",kind:"editor"}},{id:"claude-v2.1.327",product:"claude",version:"2.1.327",date:"2026-11-18",publishedAt:"2026-11-17T23:17:45Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.327",highlights:["Added a confirmation before /install-github-app changes a repository","Added claude mcp add-json <name> - to read the server's JSON from stdin, so tokens can stay off the command line; not available inside a Claude Code session","Added a line when a resumed session's earlier messages can't be loaded"],firstSeenAt:"2026-11-24T12:47:34.177Z",guide:{kind:"ai",title:"新增安装 GitHub 应用前的确认步骤",summary:"在更改仓库时，会添加一个确认步骤以确保用户明确了解更改内容。",audience:"Claude Code 用户",action:"在安装 GitHub 应用前，系统会提示用户确认更改仓库的操作。",basis:"Added a confirmation before /install-github-app changes a repository",format:5}},{id:"codex-rust-v0.169.1",product:"codex",version:"0.169.1",date:"2026-11-18",publishedAt:"2026-11-17T22:21:10Z",url:"https://github.com/openai/codex/releases/tag/rust-v0.169.1",highlights:[],firstSeenAt:"2026-11-24T11:35:59.658Z",guide:{title:"Codex CLI 发布 0.169.1",summary:"这个补丁版本提供了代码差异链接，发布页没有列出具体的功能变化。",audience:"需要核对 Codex CLI 补丁版本的用户。",action:"打开官方发布页中的 Full Changelog，查看与 0.169.0 的代码差异。",kind:"editor"}},{id:"claude-v2.1.326",product:"claude",version:"2.1.326",date:"2026-11-17",publishedAt:"2026-11-16T22:11:05Z",url:"https://github.com/anthropics/claude-code/releases/tag/v2.1.326",highlights:["Added support for turning on Code Mode while agent tea
